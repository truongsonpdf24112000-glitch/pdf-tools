name: Build Desktop App (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache electron download
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron
            ~\AppData\Local\electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package.json') }}

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      - name: Build Windows (portable + NSIS)
        run: npx electron-builder --win portable nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-desktop-windows
          path: |
            desktop/dist/*.exe
            !desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
